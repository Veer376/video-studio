[project]
name = "story-video-maker"
version = "0.1.0"
description = "Deterministic renderer for narrated image-based story videos."
requires-python = ">=3.11"
dependencies = ["pillow>=10"]

[project.scripts]
story-video = "cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
