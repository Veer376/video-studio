<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #23344d; }
      .label { font: 700 25px Arial, sans-serif; fill: #23344d; }
      .small { font: 20px Arial, sans-serif; fill: #33465f; }
      .road { fill: #efc983; stroke: #d79d43; stroke-width: 5; }
      .lane { fill: #ffe3a8; stroke: #d79d43; stroke-width: 4; }
      .site { stroke: #ffffff; stroke-width: 8; rx: 24; }
      .sight { stroke: #e84b7a; stroke-width: 7; stroke-dasharray: 18 14; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e84b7a"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#bcefa1"/>
  <path d="M0 420 H1600 V650 H0 Z" class="road"/>
  <path d="M705 0 H930 V1000 H705 Z" class="road"/>
  <circle cx="818" cy="535" r="210" fill="#f7d99c" stroke="#d79d43" stroke-width="6"/>
  <circle cx="818" cy="535" r="86" fill="#ffd94d" stroke="#2d9fad" stroke-width="9"/>
  <text x="818" y="527" text-anchor="middle" class="label">CLOCK</text>
  <text x="818" y="557" text-anchor="middle" class="label">TOWER</text>

  <rect x="130" y="670" width="460" height="245" fill="#ffd35f" class="site"/>
  <text x="360" y="762" text-anchor="middle" class="label">ALOO HOUSE</text>
  <text x="360" y="798" text-anchor="middle" class="small">front faces northeast</text>
  <rect x="430" y="820" width="220" height="135" fill="#4fc5c8" class="site"/>
  <text x="540" y="882" text-anchor="middle" class="label">WORKSHOP</text>
  <text x="540" y="911" text-anchor="middle" class="small">south/right side</text>

  <rect x="1030" y="675" width="360" height="210" fill="#ff8e73" class="site"/>
  <text x="1210" y="760" text-anchor="middle" class="label">CHAI + SAMOSA</text>
  <text x="1210" y="795" text-anchor="middle" class="label">STALL</text>
  <text x="1210" y="828" text-anchor="middle" class="small">counter faces house + chowk</text>

  <rect x="1030" y="90" width="455" height="225" fill="#ee8ac8" class="site"/>
  <text x="1257" y="185" text-anchor="middle" class="label">MARKET LANE</text>
  <text x="1257" y="220" text-anchor="middle" class="small">shops, school farther east</text>

  <rect x="100" y="100" width="455" height="225" fill="#85cdf7" class="site"/>
  <text x="327" y="185" text-anchor="middle" class="label">POLICE POST + CLINIC</text>
  <text x="327" y="220" text-anchor="middle" class="small">northwest civic corner</text>

  <path d="M665 770 C760 710 865 680 1035 735" class="sight"/>
  <text x="823" y="735" text-anchor="middle" class="small">mutual house/stall sightline</text>
  <path d="M540 730 C670 650 730 610 785 570" class="sight"/>
  <text x="560" y="640" text-anchor="middle" class="small">clock-tower sightline</text>

  <text x="50" y="465" class="small">WEST ROAD</text>
  <text x="1425" y="465" class="small">EAST ROAD</text>
  <text x="945" y="95" class="small">NORTH: LOW GREEN HILLS</text>
  <text x="952" y="965" class="small">SOUTH: FIELDS, VEGETABLE PATCH, RIVER ROAD</text>
  <path d="M1520 125 v-70" stroke="#23344d" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="1520" y="160" text-anchor="middle" class="label">N</text>
  <rect x="285" y="8" width="1030" height="68" rx="24" fill="#ffffff" opacity="0.88"/>
  <text x="800" y="58" text-anchor="middle" class="title">ALOO VILLAGE CORE — FIXED TOP-DOWN MAP</text>
</svg>
