[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-project"
version = "0.1.0"
description = "Experimental Gemini Omni Flash scene-generation pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.25.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.62.0"]

[tool.setuptools.packages.find]
include = ["scripts*"]
